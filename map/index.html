<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCUAP Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; }
    .title-card {
      position: absolute; top: 14px; left: 54px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3); max-width: 300px;
    }
    .title-card h1 { margin: 0 0 4px; font-size: 1.1rem; }
    .title-card p  { margin: 0 0 8px; font-size: 0.85rem; color: #444; }
    .title-card button {
      font: inherit; font-size: 0.8rem; padding: 4px 10px; margin-right: 4px;
      border: 1px solid #bbb; border-radius: 4px; background: #f5f5f5; cursor: pointer;
    }
    .title-card button:hover { background: #e8e8e8; }
    @keyframes flow { to { stroke-dashoffset: -1000; } }
    .flow-line { stroke-dasharray: 10 8; animation: flow 22s linear infinite; }
    .main-halo div {
      width: 56px; height: 56px; border-radius: 50%; border: 3px solid #c0392b;
      box-sizing: border-box; pointer-events: none;
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.45); opacity: 0.9; } 100% { transform: scale(1); opacity: 0; } }
    .popup-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
    .popup-img { display: block; width: 260px; max-width: 100%; height: auto; border-radius: 6px; margin: 4px 0 6px; }
    .popup-desc { font-size: 0.9rem; line-height: 1.35; }
  </style>
</head>

  };

  function popupHtml(p) {
    const d = descOf(p);
    const img = IMAGES[nameOf(p)];
    return '<div class="popup-name">' + esc(nameOf(p)) + "</div>" +
           (img ? '<img class="popup-img" src="' + esc(img.src) + '" width="' + img.w + '" height="' + img.h +
                  '" alt="' + esc(nameOf(p)) + '">' : "") +
           (d ? '<div class="popup-desc">' + esc(d) + "</div>" : "");
  }

  // Color lines by artist, matched on the line name
  function lineColor(name) {
    name = name.toLowerCase();
    if (name.includes("gloria")) return "#c0392b";
    if (name.includes("ish"))    return "#2c5f8a";
    if (name.includes("tomas"))  return "#27864e";
    return "#666666";
  }

  // ---- Lines layer (added first so points draw on top) ----
  const CURVE_AMOUNT = 0.2;  // how much the lines bow (0 = straight)

  // Quadratic bezier between two [lat, lng] points, bowed sideways
  function curve(a, b) {
    const dLat = b[0] - a[0], dLng = b[1] - a[1];
    let pLat = -dLng * CURVE_AMOUNT, pLng = dLat * CURVE_AMOUNT;  // perpendicular offset
    if (pLat < 0) { pLat = -pLat; pLng = -pLng; }                 // bow consistently northward
    const m = [(a[0] + b[0]) / 2 + pLat, (a[1] + b[1]) / 2 + pLng];
    const pts = [];
    for (let t = 0; t <= 60; t++) {
      const u = t / 60, v = 1 - u;
      pts.push([v*v*a[0] + 2*v*u*m[0] + u*u*b[0], v*v*a[1] + 2*v*u*m[1] + u*u*b[1]]);
    }
    return pts;
  }

  const linesLayer = L.layerGroup();  // shown together with the Pittsburgh locations
  linesData.features.forEach(f => {
    if (!f.geometry || f.geometry.type !== "LineString") return;
    const c = f.geometry.coordinates;
    const start = [c[0][1], c[0][0]];
    const end = [c[c.length - 1][1], c[c.length - 1][0]];
    const path = curve(start, end);
    const color = lineColor(nameOf(f.properties));
    const base = { color: color, weight: 4, opacity: 0.95, className: "flow-line" };

    // dark shadow underneath for contrast, then the animated line on top
    L.polyline(path, { color: "#000", weight: 8, opacity: 0.25, interactive: false }).addTo(linesLayer);
    const line = L.polyline(path, base).addTo(linesLayer);
    line.bindPopup(popupHtml(f.properties));
    line.on("mouseover", () => line.setStyle({ weight: 6, opacity: 1 }));
    line.on("mouseout",  () => line.setStyle(base));
  });

  // ---- Points layers ----
  // Always visible: the main place + the artists' home cities.
  // Revealed on click of the main place: every other Pittsburgh point (and the connection lines).
  let mainLatLng = null;
  let mainMarker = null;

  const isPoint = f => f.geometry && f.geometry.type === "Point";
  const isSub = f => {
    const n = nameOf(f.properties);
    return n !== MAIN_PLACE && !HOME_CITIES.includes(n);
  };

  function pointToLayer(f, latlng) {
    const name = nameOf(f.properties);
    const isMain = name === MAIN_PLACE;
    const isHome = HOME_CITIES.includes(name);
    if (isMain) mainLatLng = latlng;
    const m = L.circleMarker(latlng, {
      radius: isMain ? 14 : 8,
      fillColor: isMain ? "#c0392b" : isHome ? "#e67e22" : "#2c5f8a",
      color: "#ffffff", weight: isMain ? 4 : 2, fillOpacity: 0.95
    });
    if (isMain) mainMarker = m;
    return m;
  }

  function onEachPoint(f, lyr) {
    const name = nameOf(f.properties);
    const isMain = name === MAIN_PLACE;
    if (isMain) {
      lyr.bindPopup(popupHtml(f.properties) +
        '<div class="popup-desc">Click this point to show or hide the Pittsburgh locations.</div>');
      lyr.bindTooltip(name + " (click to explore)", { direction: "top", offset: [0, -10] });
      lyr.on("click", () => toggleSubpoints());
      return;
    }
    lyr.bindPopup(popupHtml(f.properties));
    lyr.bindTooltip(name, { direction: "top", offset: [0, -6] });
    let opened = false;
    lyr.on("popupclose", () => { opened = false; });
    lyr.on("click", () => {
      // first click opens popup; clicking again zooms in
      if (opened) map.flyTo(lyr.getLatLng(), CLICK_ZOOM);
      opened = true;
    });
  }

  const baseLayer = L.geoJSON(pointsData, {
    filter: f => isPoint(f) && !isSub(f), pointToLayer, onEachFeature: onEachPoint
  }).addTo(map);

  const subLayer = L.geoJSON(pointsData, {
    filter: f => isPoint(f) && isSub(f), pointToLayer, onEachFeature: onEachPoint
  });  // not added yet: revealed by clicking the main place

  // Pulsing ring around the main place so it stands out
  if (mainLatLng) {
    L.marker(mainLatLng, {
      icon: L.divIcon({ className: "main-halo", html: "<div></div>", iconSize: [56, 56] }),
      interactive: false, keyboard: false
    }).addTo(baseLayer);
  }

  function setSubpoints(show) {
    if (show) {
      subLayer.addTo(map);
      linesLayer.addTo(map);
      if (mainMarker) mainMarker.bringToFront();   // keep the main place on top
    } else {
      map.removeLayer(subLayer);
      map.removeLayer(linesLayer);
    }
  }
  function toggleSubpoints() {
    const show = !map.hasLayer(subLayer);
    setSubpoints(show);
    if (show) showPittsburgh();
  }

  L.control.layers(null, {
    "Main place & home cities": baseLayer,
    "Pittsburgh locations": subLayer,
    "Connection lines": linesLayer
  }, { collapsed: false }).addTo(map);

  // ---- Views ----
  const allPoints = L.geoJSON(pointsData, { filter: isPoint });   // used only for bounds
  function showAll() { map.fitBounds(allPoints.getBounds(), { padding: [50, 50] }); }
  function showPittsburgh() {
    const b = L.latLngBounds([]);
    allPoints.eachLayer(l => {
      const ll = l.getLatLng();
      if (ll.lat > 40 && ll.lat < 41 && ll.lng > -81 && ll.lng < -79) b.extend(ll);
    });
    if (b.isValid()) map.flyToBounds(b, { padding: [50, 50] });
  }
  document.getElementById("btn-all").onclick = () => { setSubpoints(true); showAll(); };
  document.getElementById("btn-pgh").onclick = () => { setSubpoints(true); showPittsburgh(); };

  // Open centered on the main place (falls back to showing everything)
  if (mainLatLng) map.setView(mainLatLng, START_ZOOM); else showAll();
  </script>
